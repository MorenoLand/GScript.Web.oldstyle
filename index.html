const { useState, useEffect, useRef, useCallback } = React;

const ClickSpark = ({
  sparkColor = '#40ff40',
  sparkSize = 10,
  sparkRadius = 15,
  sparkCount = 8,
  duration = 400,
  easing = 'ease-out',
  extraScale = 1.0,
  children,
  onClick
}) => {
  const canvasRef = useRef(null);
  const sparksRef = useRef([]);
  const startTimeRef = useRef(null);

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;

    const parent = canvas.parentElement;
    if (!parent) return;

    let resizeTimeout;

    const resizeCanvas = () => {
      const { width, height } = parent.getBoundingClientRect();
      if (canvas.width !== width || canvas.height !== height) {
        canvas.width = width;
        canvas.height = height;
      }
    };

    const handleResize = () => {
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(resizeCanvas, 100);
    };

    const ro = new ResizeObserver(handleResize);
    ro.observe(parent);

    resizeCanvas();

    return () => {
      ro.disconnect();
      clearTimeout(resizeTimeout);
    };
  }, []);

  const easeFunc = useCallback(
    t => {
      switch (easing) {
        case 'linear':
          return t;
        case 'ease-in':
          return t * t;
        case 'ease-in-out':
          return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
        default:
          return t * (2 - t);
      }
    },
    [easing]
  );

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');

    let animationId;

    const draw = timestamp => {
      if (!startTimeRef.current) {
        startTimeRef.current = timestamp;
      }
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      sparksRef.current = sparksRef.current.filter(spark => {
        const elapsed = timestamp - spark.startTime;
        if (elapsed >= duration) {
          return false;
        }

        const progress = elapsed / duration;
        const eased = easeFunc(progress);

        const distance = eased * sparkRadius * extraScale;
        const lineLength = sparkSize * (1 - eased);

        const x1 = spark.x + distance * Math.cos(spark.angle);
        const y1 = spark.y + distance * Math.sin(spark.angle);
        const x2 = spark.x + (distance + lineLength) * Math.cos(spark.angle);
        const y2 = spark.y + (distance + lineLength) * Math.sin(spark.angle);

        ctx.strokeStyle = sparkColor;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();

        return true;
      });

      animationId = requestAnimationFrame(draw);
    };

    animationId = requestAnimationFrame(draw);

    return () => {
      cancelAnimationFrame(animationId);
    };
  }, [sparkColor, sparkSize, sparkRadius, sparkCount, duration, easeFunc, extraScale]);

  const handleClick = e => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    const now = performance.now();
    const newSparks = Array.from({ length: sparkCount }, (_, i) => ({
      x,
      y,
      angle: (2 * Math.PI * i) / sparkCount,
      startTime: now
    }));

    sparksRef.current.push(...newSparks);
  };

  const handleChildClick = (e) => {
    if (onClick) {
      onClick(e);
    }
  };

  return (
    <div
      style={{
        position: 'relative',
        width: '100%',
        height: '100%',
        display: 'inline-block'
      }}
      onClick={handleClick}
    >
      <canvas
        ref={canvasRef}
        style={{
          width: '100%',
          height: '100%',
          display: 'block',
          userSelect: 'none',
          position: 'absolute',
          top: 0,
          left: 0,
          pointerEvents: 'none',
          zIndex: 1
        }}
      />
      {children}
    </div>
  );
};

function DiscordWidget() {
  const [stats, setStats] = useState(null);
  const [widget, setWidget] = useState(null);
  const [error, setError] = useState(false);

  useEffect(() => {
    Promise.all([
      fetch('https://api.moreno.land/api/discord/stats'),
      fetch('https://api.moreno.land/api/discord/users')
    ])
    .then(async ([statsRes, widgetRes]) => {
      const statsData = await statsRes.json();
      const widgetData = await widgetRes.json();
      setStats(statsData);
      setWidget(widgetData);
    })
    .catch(() => setError(true));
  }, []);

  const [hoverMember, setHoverMember] = useState(null);
  const [hoverPos, setHoverPos] = useState({x:0,y:0});

  if (error) return <div className="discord-loading">Failed to load Discord data</div>;
  if (!widget || !stats) return <div className="discord-loading">Loading...</div>;

  const membersHtml = widget.members ? widget.members.map(member =>
    <div key={member.username} className="discord-member"
      onMouseMove={(e) => { if (!hoverMember || hoverMember.username !== member.username) setHoverMember(member); setHoverPos({x: e.clientX + 12, y: e.clientY - 10}); }}
      onMouseLeave={() => setHoverMember(null)}>
      <img src={member.avatar_url || 'https://cdn.discordapp.com/embed/avatars/0.png'} alt={member.username} className="discord-avatar" />
      <span>{member.username}</span>
    </div>
  ) : null;

  const hoverCard = hoverMember ? (
    <div className="discord-hover" style={{top: hoverPos.y}}>
      <img src={hoverMember.avatar_url || 'https://cdn.discordapp.com/embed/avatars/0.png'} alt={hoverMember.username} className="discord-hover-avatar" />
      <span className="discord-hover-name">{hoverMember.username}</span>
    </div>
  ) : null;

  return (
    <div className="discord-custom">
      {hoverMember && ReactDOM.createPortal(
        <div className="discord-hover" style={{top: hoverPos.y, left: hoverPos.x}}>
          <img src={hoverMember.avatar_url || 'https://cdn.discordapp.com/embed/avatars/0.png'} alt={hoverMember.username} className="discord-hover-avatar" />
          <span className="discord-hover-name">{hoverMember.username}</span>
        </div>,
        document.body
      )}
      <div className="discord-header">
        <h3>#gscript</h3>
        <p>{stats.online || widget.presence_count || 0} online / {stats.total || '?'} total</p>
      </div>
      {membersHtml && <div className="discord-members">{membersHtml}</div>}
      <a href="https://discord.gscript.dev" target="_blank"><i className="fab fa-discord"></i><span>Join Discord</span></a>
    </div>
  );
}

const scrollIntoNav = (el) => {
  if (!el) return;
  const nav = document.querySelector('.nav');
  if (!nav) return;
  setTimeout(() => {
    const navRect = nav.getBoundingClientRect();
    const elRect = el.getBoundingClientRect();
    if (elRect.bottom > navRect.bottom) {
      nav.scrollTo({ top: nav.scrollTop + (elRect.bottom - navRect.bottom) + 20, behavior: 'smooth' });
    }
  }, 50);
};

const NavSection = ({ label, icon, defaultOpen, children }) => {
  const [open, setOpen] = useState(defaultOpen !== false);
  const bodyRef = useRef(null);
  const toggle = () => {
    const next = !open;
    setOpen(next);
    if (next && bodyRef.current) scrollIntoNav(bodyRef.current);
  };
  return (
    <div className="nav-section">
      <div className={`nav-section-header${open ? '' : ' collapsed'}`} onClick={toggle}>
        <i className={`fas fa-chevron-down`}></i>{label}
      </div>
      <div ref={bodyRef} className={`nav-section-body${open ? '' : ' collapsed'}`} style={{maxHeight: open ? '2000px' : '0'}}>
        {children}
      </div>
    </div>
  );
};

const NavItem = ({ item, handleLinkClick, setShowIndexing, setShowBeautify }) => {
  const [expanded, setExpanded] = useState(false);
  const subRef = useRef(null);
  const onClick = (e) => {
    if (item.submenu) { e.preventDefault(); const next = !expanded; setExpanded(next); if (next && subRef.current) scrollIntoNav(subRef.current); return; }
    if (item.href === '/?indexing') { e.preventDefault(); setShowIndexing(true); window.history.pushState(null, '', '/?indexing'); return; }
    if (item.href === '/?beautify') { e.preventDefault(); setShowBeautify(true); window.history.pushState(null, '', '/?beautify'); return; }
    handleLinkClick(e);
  };
  return (
    <>
      <ClickSpark sparkColor="#40ff40">
        <a className={`nav-link${item.submenu ? ' nav-expand' + (expanded ? ' open' : '') : ''}`} href={item.href || '#'} onClick={onClick}>
          <i className={item.icon}></i><span>{item.text}</span>
          {item.submenu && <i className="fas fa-chevron-right nav-chevron"></i>}
        </a>
      </ClickSpark>
      {expanded && item.submenu && (
        <div className="nav-sub" ref={subRef}>
          {item.submenu.map((sub, sidx) => (
            <ClickSpark key={sidx} sparkColor="#40ff40">
              <a className="nav-link" href={sub.href} onClick={handleLinkClick}><i className={sub.icon}></i><span>{sub.text}</span></a>
            </ClickSpark>
          ))}
        </div>
      )}
    </>
  );

<script>
const initMenus = () => {
  const { computePosition, flip, shift, offset, autoUpdate } = window.FloatingUI || {};
  const cleanups = new Map();

  const cleanup = (id) => {
    if (cleanups.has(id)) {
      cleanups.get(id)();
      cleanups.delete(id);
    }
  };

  const closeAll = (except = null) => {
    document.querySelectorAll('.dropdown').forEach(d => {
      if (d === except) return;
      const id = d.dataset.id;
      cleanup(id);
      const content = d.querySelector('.dropdown-content');
      const btn = d.querySelector('.dropdown-btn');
      if (content) content.style.display = 'none';
      if (btn) btn.classList.remove('active');
      d.querySelectorAll('.submenu-content').forEach(s => s.style.display = 'none');
    });
  };

  document.querySelectorAll('.dropdown').forEach((dropdown, i) => {
    const id = `drop-${i}`;
    dropdown.dataset.id = id;
    const content = dropdown.querySelector('.dropdown-content');
    const btn = dropdown.querySelector('.dropdown-btn');
    let timer;

    const position = () => {
      if (!content || content.style.display === 'none') return;
      const updatePosition = () => {
        const middleware = [];
        if (typeof offset === 'function') middleware.push(offset(8));
        if (typeof flip === 'function') middleware.push(flip());
        if (typeof shift === 'function') middleware.push(shift({ padding: 10 }));
        middleware.push({
          name: 'preventOverflow',
          fn({ middlewareData, ...args }) {
            const floating = args.floating;
            if (!floating) return {};

            const rect = floating.getBoundingClientRect();
            const windowHeight = window.innerHeight;
            const overflowBottom = rect.bottom - windowHeight;

            if (overflowBottom > 0) {
              return {
                y: (args.y || 0) - overflowBottom - 10
              };
            }

            return {};
          }
        });
        computePosition(dropdown, content, {
          placement: 'bottom-start',
          middleware
        }).then(({ x, y }) => {
          content.style.left = `${x}px`;
          content.style.top = `${y}px`;
        });
      };
      if (typeof autoUpdate === 'function') {
        const clean = autoUpdate(dropdown, content, updatePosition);
        cleanups.set(id, clean);
      } else {
        updatePosition();
      }
    };

    const hasSubmenuHover = () => Array.from(dropdown.querySelectorAll('.submenu-content')).some(s => s.style.display === 'block' && s.matches(':hover'));

    const keepVisible = () => {
      clearTimeout(timer);
      if (content) content.style.display = 'block';
      if (btn) btn.classList.add('active');
    };

    dropdown.addEventListener('mouseenter', () => {
      clearTimeout(timer);
      closeAll(dropdown);
      if (content) {
        content.style.display = 'block';
        position();
      }
      if (btn) btn.classList.add('active');
    });

    dropdown.addEventListener('mouseleave', (e) => {
      if (e.relatedTarget && (content?.contains(e.relatedTarget) || hasSubmenuHover())) return;
      timer = setTimeout(() => {
        if (!content?.matches(':hover') && !hasSubmenuHover()) {
          if (content) content.style.display = 'none';
          if (btn) btn.classList.remove('active');
          dropdown.querySelectorAll('.submenu-content').forEach(s => s.style.display = 'none');
          cleanup(id);
        }
      }, 300);
    });

    if (content) {
      content.addEventListener('mouseenter', keepVisible);
      content.addEventListener('mouseleave', (e) => {
        const movingToSubmenu = e.relatedTarget && Array.from(dropdown.querySelectorAll('.submenu-content')).some(s => s === e.relatedTarget || s.contains(e.relatedTarget));
        if (movingToSubmenu) return;
        timer = setTimeout(() => {
          if (!dropdown.matches(':hover') && !hasSubmenuHover()) {
            content.style.display = 'none';
            if (btn) btn.classList.remove('active');
            cleanup(id);
          }
        }, 300);
      });
    }

    dropdown.querySelectorAll('.submenu').forEach(submenu => {
      const link = submenu.querySelector('a');
      const sub = submenu.querySelector('.submenu-content');
      if (!link || !sub) return;

      link.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        dropdown.querySelectorAll('.submenu-content').forEach(s => {
          if (s !== sub) {
            s.classList.remove('slide-down');
            s.classList.add('slide-up');
            setTimeout(() => {
              s.style.display = 'none';
              s.classList.remove('slide-up');
            }, 200);
          }
        });
        if (sub.style.display === 'block') {
          sub.classList.remove('slide-down');
          sub.classList.add('slide-up');
          setTimeout(() => {
            sub.style.display = 'none';
            sub.classList.remove('slide-up');
          }, 200);

          sub.style.display = 'block';
          sub.classList.remove('slide-up');

      link.addEventListener('mouseenter', () => {

  });
